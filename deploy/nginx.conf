# Example Nginx server block for the AI Audiobook Platform.
# Copy to /etc/nginx/sites-available/audiobook, adjust paths/domain, then:
#   ln -s /etc/nginx/sites-available/audiobook /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name audiobook.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name audiobook.example.com;
    root /var/www/audiobook/public;

    ssl_certificate     /etc/letsencrypt/live/audiobook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audiobook.example.com/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
    charset utf-8;

    client_max_body_size 600M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/audiobook.access.log;
    error_log  /var/log/nginx/audiobook.error.log;
}
