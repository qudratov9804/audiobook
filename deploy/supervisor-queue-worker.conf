; Example Supervisor program for Laravel queue workers.
; Copy to /etc/supervisor/conf.d/audiobook-worker.conf, adjust paths/user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start audiobook-worker:*

[program:audiobook-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/audiobook/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=1800
directory=/var/www/audiobook
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/audiobook/storage/logs/worker.log
stopwaitsecs=3600
